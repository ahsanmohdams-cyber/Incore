
name: Build Incore APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incore-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project files
        run: |
          echo "Checking Incore project..."
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "Project structure OK"

      - name: Build Incore APK
        run: |
          set -o pipefail
          gradle clean :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Upload Incore APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Incore-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload error diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Incore-build-errors
          path: |
            build.log
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          
